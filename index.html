<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEVEN SIGNALS - Base Sepolia</title><script src="https://unpkg.com/@base-org/account/dist/base-account.min.js"></script><style>body{font-family:system-ui,-apple-system,sans-serif;background:#0b0b0d;color:#f5f5f5;max-width:720px;margin:0 auto;padding:28px}h1{margin-bottom:8px}.card{background:#18181d;padding:18px;border-radius:14px;margin:14px 0}.muted{color:#b8b8c2}button{font-size:18px;padding:15px 18px;margin:8px 0;width:100%;border:0;border-radius:10px;font-weight:700}button:disabled{opacity:.45}code{word-break:break-all}.ok{color:#8ee59b}.bad{color:#ff8f8f}</style></head><body><h1>SEVEN SIGNALS</h1><div class="card"><b>BASE SEPOLIA TESTNET</b><p>Owner + royalty receiver:<br><code>0x78ceE8B10C4FC39FbD47B17Bb78aADe2838d05DC</code></p><p>Royalty: <b>3%</b></p><p>Transaction value: <b>0 ETH</b></p><p class="muted">The deployment payload is hash-checked before this page can enable approval.</p></div><button id="connect" disabled>Loading verified deployment...</button><button id="deploy" disabled>Approve test deployment</button><div id="status" class="card">Checking deployment payload...</div><script>
const EXPECTED='0x78cee8b10c4fc39fbd47b17bb78aade2838d05dc',FACTORY='0x13b0D85CcB8bf860b6b79AF3029fCA081AE9beF2',CHAIN='0x14a34',EXPECTED_HASH='db68fa32e68f5e788258d78a71b64f902628ebdf74c6a4d00fa5f146edbd4102',EXPECTED_BYTES=9796;
const ENDPOINT='https://idmsuymlbvznnohdfutj.supabase.co/rest/v1/seven_signals_payload?id=eq.base-sepolia-v1&select=payload_gzip_b64,calldata_sha256,calldata_bytes',APIKEY='sb_publishable_yAeIu7mTkHsdp8yUBMb4Og_CR20siDT';
const status=document.getElementById('status'),connect=document.getElementById('connect'),deploy=document.getElementById('deploy');let provider=null,account=null,DATA=null;function show(m,k=''){status.className='card '+k;status.innerHTML=m}function fail(e){deploy.disabled=true;connect.disabled=true;show(String(e?.message||e),'bad')}function b64bytes(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}async function gunzip(u){const ds=new DecompressionStream('gzip');return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer())}async function sha256(u){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',u));return [...h].map(x=>x.toString(16).padStart(2,'0')).join('')}
(async()=>{try{const r=await fetch(ENDPOINT,{headers:{apikey:APIKEY}});if(!r.ok)throw new Error('Payload check failed: HTTP '+r.status);const rows=await r.json();if(rows.length!==1)throw new Error('Verified deployment payload not found');const row=rows[0];if(row.calldata_sha256!==EXPECTED_HASH||Number(row.calldata_bytes)!==EXPECTED_BYTES)throw new Error('Payload metadata mismatch');const bytes=await gunzip(b64bytes(row.payload_gzip_b64));if(bytes.length!==EXPECTED_BYTES)throw new Error('Payload length mismatch');if(await sha256(bytes)!==EXPECTED_HASH)throw new Error('Payload hash mismatch');DATA='0x'+[...bytes].map(x=>x.toString(16).padStart(2,'0')).join('');if(!DATA.startsWith('0x66cfa057'))throw new Error('CREATE2 selector mismatch');connect.disabled=false;connect.textContent='Connect Base wallet';show('Verified deployment loaded. Connect your Base wallet.','ok')}catch(e){fail(e)}})();
connect.onclick=async()=>{try{if(!DATA)throw new Error('Deployment payload is not verified');if(typeof window.createBaseAccountSDK!=='function')throw new Error('Base Account SDK did not load. Reload this page once.');show('Opening Base wallet...');provider=window.createBaseAccountSDK({appName:'SEVEN SIGNALS Launch',appChainIds:[84532]}).getProvider();const a=await provider.request({method:'eth_requestAccounts'});account=String(a?.[0]||'').toLowerCase();if(account!==EXPECTED)throw new Error('Wrong wallet connected: '+account);try{await provider.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN}]})}catch{}const chain=String(await provider.request({method:'eth_chainId'})).toLowerCase();if(chain!==CHAIN)throw new Error('Base Sepolia was not selected. No transaction will be sent.');deploy.disabled=false;show('Wallet verified on Base Sepolia. Ready for the test deployment.','ok')}catch(e){deploy.disabled=true;show(String(e?.message||e),'bad')}};
deploy.onclick=async()=>{try{deploy.disabled=true;if(!DATA||!provider||account!==EXPECTED)throw new Error('Verification was lost. Reconnect first.');const chain=String(await provider.request({method:'eth_chainId'})).toLowerCase();if(chain!==CHAIN)throw new Error('Network changed. No transaction was sent.');show('Opening Base approval...');const tx=await provider.request({method:'eth_sendTransaction',params:[{from:account,to:FACTORY,value:'0x0',data:DATA}]});if(!/^0x[0-9a-fA-F]{64}$/.test(String(tx)))throw new Error('Unexpected transaction result: '+String(tx));show('<b>TEST DEPLOYMENT SUBMITTED.</b><br>Transaction hash:<br><code>'+tx+'</code><br><br>Copy this hash back to ChatGPT.','ok')}catch(e){deploy.disabled=false;show(String(e?.message||e),'bad')}};
</script></body></html>
